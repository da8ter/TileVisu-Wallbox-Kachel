<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="/icons.js" crossorigin="anonymous"></script>

    <!-- Haupt-Stylesheet für die Wallbox-Kachel -->
    <style>
        :root {
            /* Globale CSS-Variablen für dynamische Werte wie Ladeleistung, Farben, Animationen */
            --soc: calc(var(--socvalue) * 1%);
            --soc_ziel: calc((100 - var(--zielsocvalue)) * 1%);
            --kabel: none;
            --error_animation: none;
            --error_color: inherit; /* Default-Farbe, wird dynamisch gesetzt */
            --ladeleistung_prozent_round: calc(var(--ladeleistung) / var(--maxladeleistungvalue) * 100%);
            --led_color: #0fff;
            /* Farbverlauf für 1-phasiges Laden */
            --led_1p_1_position: calc(95% - (var(--ladeleistung) * 4%));
            /* Farbverlauf für 3-phasiges Laden */
            --led_3p_1_position: calc(30% - (var(--ladeleistung) * 2%));
            --led_3p_2_position: calc(60% - (var(--ladeleistung) * 2%));
            --led_3p_3_position: calc(95% - (var(--ladeleistung) * 2%));
        }




        html {
            background-color: var(--hintergrundfarbe);
            overflow: hidden;
        }

        body:before {
            content: '';
            display: block;
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-repeat: no-repeat;
            background-size: cover;
            

            opacity: var(--bildtransparenz);
            background: var(--background-image, none) center / cover no-repeat;
        }



        .hidden {
            display: none;
        }



        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }


        ::-webkit-scrollbar-thumb {
            background: transparent;
            border-radius: 20px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Hauptcontainer für Bild, LED und Datenbereich der Wallbox-Kachel */
        .main_container {
            width: 100%;
            display: flex;
            flex-wrap: nowrap;
            position: relative;
            font-size: 14px;
            box-sizing: border-box;
        }

        /* Container für das Bild */
        .div1 {
            width: var(--bildbreite);
            height: 100%;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        /* Bild-Element */
        .image1 {
            width: 100%;
            box-sizing: border-box;
            position: relative;
        }

        .image1 img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Bereich für die LED-Animation, zentriert über dem Wallbox-Bild */
        .led_animation_centered {
            width: 75%;
            aspect-ratio: 1 / 1;
            position: absolute;
            top: 59%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -3;
            display: inline;
        }

        /* Animation für 1-phasiges Laden */
        .led_animation_1p {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: conic-gradient(from 0deg, #fff var(--led_1p_1_position), #05d9f5 98%, #fff), #FFFFFF;
            background-size: 100% 100%;
            border-radius: 50%;
            animation-name: rotate;
            animation-duration: 10s;
            animation-iteration-count: infinite;
            animation-direction: normal;
            animation-timing-function: linear;
            animation-fill-mode: forwards;
        }

        /* Animation für 3-phasiges Laden */
        .led_animation_3p {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: conic-gradient(from 0deg, #fff var(--led_3p_1_position), #05d9f5 33%, #fff 34%, #fff var(--led_3p_2_position), #05d9f5 63%, #fff 64%, #fff var(--led_3p_3_position), #05d9f5 99%, #fff 100%), #FFFFFF;
            background-size: 100% 100%;
            border-radius: 50%;
            animation-name: rotate;
            animation-duration: 10s;
            animation-iteration-count: infinite;
            animation-direction: normal;
            animation-timing-function: linear;
            animation-fill-mode: forwards;
            
        }


        @keyframes rotate {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .led_animation_error {
            width: 97%;
            aspect-ratio: 1 / 1;
            background-color: #ff0000;
            border-radius: 50%;
            animation: blinker 1s linear infinite;
        }

        .led_animation_fertig {
            width: 97%;
            aspect-ratio: 1 / 1;
            background-color: #00d43f;
            border-radius: 50%;
        }
        .led_animation_warten {
            width: 97%;
            aspect-ratio: 1 / 1;
            background-image: conic-gradient(from 0deg, #fde004 0%, #fde004 var(--led_1p_1_position), #fde004 var(--led_1p_1_position), #fde004 98%, #fde004);
            background-size: 100% 100%;
            border-radius: 50%;

        }

        .led_animation_aus {
            width: 97%;
            aspect-ratio: 1 / 1;
            background: #fff;
            background-size: 100% 100%;
            border-radius: 50%;
            border: 2px solid #ccc;
        }

        @keyframes blinker {
            50% {
                opacity: 0;
            }
        }


        .div2 {
            width: calc(100% - var(--bildbreite));
            padding: 5px 5px 5px 2.5%;
            margin: 0px 0px 0px 2.5%;
            box-sizing: border-box;
            border-radius: 0px;
            border-left: 1px dotted #28cdab;
        }

        .balkendiagramm {
            width: 100%;
            display: flex;
            position: relative;
            margin-bottom: 2%;
            margin-top: 2%;
            box-sizing: border-box;

        }

        .balkendiagramm_soc {
            width: 100%;
            display: flex;
            position: relative;
            margin-bottom: 2%;
            margin-top: 2%;
            box-sizing: border-box;
        }

        .balken_links_leistung,
        .balken_rechts_leistung,
        .balken_links_soc,
        .balken_rechts_soc {
            height: 1.8em;
            font-size: 14px;
            transition: width 2s;
            transition-timing-function: ease;
        }

        @keyframes gradient_leistung {
            0% {
                background-position: 0 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        .balken_links_leistung {
            width: var(--ladeleistung_prozent_round);
            background: repeating-linear-gradient(to right, var(--balkenverlauffarbe1) 0%, var(--balkenverlauffarbe2) 50%, var(--balkenverlauffarbe1) 100%);
            background-size: 200% auto;
            background-position: 0 100%;
            animation: gradient_leistung 10s infinite;
            animation-fill-mode: forwards;
            animation-timing-function: linear;
            border-radius: 0px 0px 0px 0px;
            animation: none;

        }

        .balken_links_soc {
            width: var(--soc);
            background: repeating-linear-gradient(to right, var(--balkenverlaufsocfarbe1) 0%, var(--balkenverlaufsocfarbe2) 50%, var(--balkenverlaufsocfarbe1) 100%);
            background-size: 200% auto;
            background-position: 0 100%;
            animation: gradient_leistung 10s infinite;
            animation-fill-mode: forwards;
            animation-timing-function: linear;
            border-radius: 0px 0px 0px 0px;
            animation: none;

        }

        .balken_links_text_label {
            position: absolute;
            top: 50%;

            transform: translate(-0%, -50%);
            color: #fff;
            z-index: 2;
            padding-left: 7px;
            font-size: var(--balkenschriftgroesse, 12px);
            white-space: nowrap;
        }

        .balken_links_text_value {
            position: absolute;
            top: 50%;

            transform: translate(-0%, -50%);
            color: #fff;
            z-index: 2;
            padding: 3px;
            font-size: var(--balkenschriftgroesse, 12px);
            white-space: nowrap;
        }




        /* Markierung für Ziel-SOC (mit Dreiecken als Zielindikator) */
#soc_balken_container {
    position: relative;
}

#zielsoc_line_element {
    position: absolute;
    top: 0;
    bottom: 0;
    right: var(--soc_ziel);
    width: 8px;
    pointer-events: none;
    z-index: 1;
    background: none;
}
.soc-triangle {
    position: absolute;
    left: 0;
    width: 0;
    height: 0;
    border-left: 3px solid transparent;
    border-right: 3px solid transparent;
    opacity: 0.3;
}
.soc-triangle-top {
    top: 0;
    border-bottom: 0;
    border-top: 3px solid #000;
}
.soc-triangle-bottom {
    bottom: 0;
    border-top: 0;
    border-bottom: 3px solid #000;
}


        /* Ziel-SOC-Text: Standard-Position links vom Zielindikator */
        #zielsoc_text_element {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    right: calc(var(--soc_ziel) + 5px); /* 5px Abstand zum Zielindikator */
    color: inherit; /* Standardschriftfarbe verwenden */
    z-index: 2;
    font-size: var(--balkenschriftgroesse, 12px);
    padding: 0 5px;
    white-space: nowrap;
}


        /* Ziel-SOC-Text: Alternative Position rechts vom Zielindikator */
        #zielsoc_text_element.position-before-bar {
            right: auto; /* 'right' zurücksetzen */
    left: calc(100% - var(--soc_ziel) - 5px); /* 5px Abstand zum Zielindikator */
            /* Farbe bleibt unverändert, Basisklasse regelt Textfarbe */
        }

        .balken_rechts {
            width: 100%;
            border-radius: 5;
            background: linear-gradient(to right, rgba(135, 135, 135, 0.6) 0%, rgba(135, 135, 135, 0.2) 100%);
            overflow: hidden;
            border-radius: 5px;
        }

        .status {
            color: var(--statuscolor);
            font-size: var(--statusschriftgroesse, 15px);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: inline-block;
            max-width: 100%;
            vertical-align: bottom;
        }

        .statuslabel {
            font-size: var(--statusschriftgroesse, 15px);
        }

        .status-error {
            animation: var(--error_animation);
            animation-fill-mode: both;
            color: #ff0000 !important; /* Direkt rot setzen, hat Priorität */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: inline-block;
            max-width: 100%;
            vertical-align: bottom;
        }

        #ladeleistung,
        #soc,
        #verbrauchtag,
        #verbrauchgesamt,
        #kostentag,
        #kostengesamt,
        #verriegelung,
        #kabel,
        #zugangskontrolle,
        #reichweite {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: inline-block;
            max-width: 100%;
            vertical-align: bottom;
        }

        .error_animation {
            animation: var(--error_animation);
            animation-fill-mode: both;
            color: var(--error_color);
        }

        @keyframes blink {
            0% {
                opacity: 0
            }

            50% {
                opacity: 1
            }

            100% {
                opacity: 0
            }
        }

        .container_daten {
            display: flex;
            flex-wrap: nowrap;
            width: 100%;
            font-size: 14px;
        }

        .daten_links {
            margin-right: 20px;
            border: 0px solid #000;
        }

        .daten_rechts {
            border: 0px solid #000;
        }

        .icon {
            color: #26d4b9;
        }

        th,
        td {
            padding: 2;
            text-align: left;
            border: none;
            border-bottom: 1px solid rgba(128, 128, 128, 0.2);
            font-size: var(--infoschriftgroesse, 13px);


        }
    </style>


    <!--
        JavaScript-Bereich: Hilfsfunktionen und dynamische Anpassungen der Benutzeroberfläche
    -->
    <script>
        /**
         * Zeigt mehrere Elemente anhand ihrer IDs an (Hilfsfunktion für Entwickler)
         * @param {...string} ids - Liste von Element-IDs
         */
        const showElements = (...ids) => {
            ids.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.remove('hidden');
            });
        };

        /**
         * Setzt den Textinhalt eines Elements sicher (Hilfsfunktion für Entwickler)
         * @param {string} id - Element-ID
         * @param {string} value - Anzuzeigender Wert
         */
        const setText = (id, value) => {
            const el = document.getElementById(id);
            if (el) el.textContent = value;
        };

        /**
         * Aktualisiert die Fehleranzeige basierend auf dem Fehlerwert
         * @param {string} fehlerText - Fehlermeldung (aus locale.json)
         * @param {number} fehlerRawValue - Fehlercode/Wert
         */
        function updateFehlerDisplay(fehlerText, fehlerRawValue) {
            // Aktualisiert die Fehleranzeige basierend auf dem Fehlerwert
            const fehlerRow = document.getElementById('trfehler');
            const fehlerElement = document.getElementById('fehler');
            const root = document.documentElement;
            if (!fehlerElement || !fehlerRow) return;

            // Zeigt die Fehlerzeile an, sobald Fehlerinformationen vorliegen
            fehlerRow.classList.remove('hidden');

            // Setzt den formatierten Text (kann leer sein)
            if (typeof fehlerText !== 'undefined') fehlerElement.textContent = fehlerText;

            // Setzt Farbe/Klasse basierend auf dem Fehlerwert
            if (parseInt(fehlerRawValue, 10) !== 0) {
                fehlerElement.className = 'status-error';
                fehlerElement.style.color = '#ff0000'; // fallback inline
            } else {
                // Fehlerwert ist 0: Standardfarbe und keine Klasse setzen
                fehlerElement.className = '';
                fehlerElement.style.color = '';
            }
        }

        // Zuordnung für Sichtbarkeitslogik der UI-Elemente
        const showCases = {
            'verbrauchgesamt': ["verbrauchgesamt", "verbrauchgesamthead", "verbrauch"],
            'verbrauchtag': ["verbrauchtag", "verbrauchtaghead", "verbrauch"],
            'kostentag': ["trkosten", "kostentag", "kostentaghead"],
            'kostengesamt': ["trkosten", "kostengesamt", "kostengesamthead"],
            'verriegelung': ["trverriegelung"],
            'reichweite': ["trreichweite"],
            'kabel': ["trkabel"],
            'zugangskontrolle': ["trzugang"],
            'fehler': ["trfehler"]
        };

        // Globale Variable für den aktuellen Animationstyp
        window.currentAnimation = '';

        // Globale Variable für die Anzahl der Phasen
        window.phasecount = 1;

        // Debug-Schalter: Log-Ausgaben werden unterdrückt, wenn DEBUG = false
        const DEBUG = false;
        if (!DEBUG) {
            console.log = () => {};
            console.warn = () => {};
        }

        /**
         * Aktualisiert die LED-Animation
         */
        function updateLedAnimation() {
            const ledAnimation = document.getElementById('led_animation');
            if (!ledAnimation) return;

            const animation = window.currentAnimation || '';
            const phasecount = window.phasecount || 1;

            console.log('Aktualisiert die LED-Animation. Typ:', animation, 'Phasenanzahl:', phasecount);

            switch (animation) {
                case 'standby_animation':
                    ledAnimation.className = 'led_animation_aus';
                    break;
                case 'laden_animation':
                    if (phasecount === 1) {
                        ledAnimation.className = 'led_animation_1p';
                    } else if (phasecount === 2 || phasecount === 3) {
                        ledAnimation.className = 'led_animation_3p';
                    } else {
                        ledAnimation.className = 'led_animation_1p'; // Fallback
                    }
                    break;
                case 'fertig_animation':
                    ledAnimation.className = 'led_animation_fertig';
                    break;
                case 'error_animation':
                    ledAnimation.className = 'led_animation_error';
                    break;
                case 'warten_animation':
                    ledAnimation.className = 'led_animation_warten';
                    break;
                default:
                    ledAnimation.className = '';
            }
        }

        /**
         * Verarbeitet die empfangenen Daten und aktualisiert die Benutzeroberfläche
         * @param {string} data - Empfangene Daten als JSON-String
         */
        function handleMessage(data) {
            let decodedData;
            try {
                decodedData = JSON.parse(data);
            } catch (e) {
                console.error('Fehler beim Parsen der Daten:', data, e);
                return;
            }
            if (DEBUG) console.log('Dekodierte Daten:', decodedData);

            const root = document.documentElement;
            const ledAnimation = document.getElementById('led_animation');
            const imageElem = document.getElementById('image');
            const leistungDiv = document.getElementById('leistungdiv');

            // Prüft, ob die Konfigurationsvariablen vorhanden sind
            if (typeof statusImages === 'undefined' || typeof statusColor === 'undefined' || typeof statusAnimation === 'undefined' || typeof window.assets === 'undefined') {
                console.warn('Konfigurationsvariablen (statusImages, statusColor, statusAnimation, window.assets) fehlen!');
            }

            // Verarbeitet die empfangenen Daten und aktualisiert die Benutzeroberfläche
            for (const parameter in decodedData) {
                const value = decodedData[parameter];
                const paramKey = String(parameter).toLowerCase();
                if (DEBUG) console.log('Aktueller Parameter:', paramKey, 'Wert:', value);

                // Sichtbarkeitslogik für UI-Elemente
                if (showCases[paramKey]) {
                    if (value) showElements(...showCases[paramKey]);
                    if (paramKey !== 'phasen' && paramKey !== 'phasenvalue') {
                        setText(paramKey, value);
                    }
                    continue;
                }

                // Hauptlogik
                switch (paramKey) {

                    case 'status':
                        var element = document.getElementById(paramKey);
                        if (element) element.textContent = value;
                        break;
                    case 'statusvalue': {
                        // Defensive: Fallback auf Index 0, falls ungültig
                        let index = value;
                        if (!statusImages || !statusImages[index]) index = 0;
                        // Bild entsprechend dem Status setzen
                        if (imageElem && window.assets) {
                            switch (statusImages[index]) {
                                case 'goe_an':
                                    imageElem.src = window.assets.img_goe_an;
                                    break;
                                case 'goe_aus':
                                    imageElem.src = window.assets.img_goe_aus;
                                    break;
                                default:
                                    imageElem.src = window.assets.img_goe_aus;
                                    break;
                            }
                        }
                        // Statusfarbe setzen
                        if (statusColor && statusColor[index]) {
                            root.style.setProperty('--statuscolor', statusColor[index]);
                        }
                        // Animationstyp setzen und Animation aktualisieren
                        if (statusAnimation) {
                            window.currentAnimation = statusAnimation[index] || '';
                            if (DEBUG) console.log('Calling updateLedAnimation() after currentAnimation update');
                            updateLedAnimation();
                        }
                        break;
                    }
                    case 'ladeleistungvalue':
                        // Setzt die CSS-Variable für die Ladeleistung (für Animation und Balken)
                        console.log('Set --ladeleistung to:', value);
                        root.style.setProperty('--ladeleistung', value);
                        
                        // Ladeleistungs-Balken aktualisieren, falls Maximalwert gesetzt ist
                        const maxPower = getComputedStyle(root).getPropertyValue('--maxladeleistungvalue');
                        if (maxPower && maxPower !== '') {
                            const percent = (parseFloat(value) / parseFloat(maxPower)) * 100;
                            console.log('Calculate charging power percentage:', percent + '%');
                            root.style.setProperty('--ladeleistung_percent_round', percent + '%');
                        }
                        break;
                    case 'ladeleistung':
                        var element = document.getElementById(paramKey);
                        if (element) element.textContent = value;
                        if (value) {
                            leistungDiv.className = 'balkendiagramm';
                            // Setzt die CSS-Variable für die Ladeleistung (für Animation und Balken)
                            console.log('Set --ladeleistung to:', value);
                            root.style.setProperty('--ladeleistung', value);
                            
                            // Ladeleistungs-Balken aktualisieren, falls Maximalwert gesetzt ist
                            const maxPower2 = getComputedStyle(root).getPropertyValue('--maxladeleistungvalue');
                            if (maxPower2 && maxPower2 !== '') {
                                const percent = (parseFloat(value) / parseFloat(maxPower2)) * 100;
                                console.log('Calculate charging power percentage:', percent + '%');
                                root.style.setProperty('--ladeleistung_percent_round', percent + '%');
                            }
                        }
                        break;
                    case 'socvalue':
                        root.style.setProperty('--socvalue', value);
                        //updateZielSOCTextPosition(); // Textposition für Ziel-SOC aktualisieren
                        break;
                    case 'soc':
                        var element = document.getElementById(paramKey);
                        if (element) element.textContent = value;
                        //updateZielSOCTextPosition(); // Textposition für Ziel-SOC aktualisieren
                        break;
                    case 'zielsocvalue':
                        root.style.setProperty('--zielsocvalue', decodedData[parameter]);
                        updateZielSOCTextPosition(); // Textposition für Ziel-SOC aktualisieren
                        break;
                    case 'targetsoc':
                        // (Optional) Textinhalt setzen, aktuell nicht verwendet
                        break;
                    case 'maxladeleistungvalue':
                        console.log('Set --maxladeleistungvalue to:', value);
                        root.style.setProperty('--maxladeleistungvalue', value);
                        
                        // Ladeleistungs-Balken aktualisieren, falls Ladeleistung gesetzt ist
                        const chargingPower = getComputedStyle(root).getPropertyValue('--ladeleistung');
                        if (chargingPower && chargingPower !== '') {
                            const percent = (parseFloat(chargingPower) / parseFloat(value)) * 100;
                            console.log('Calculate charging power percentage:', percent + '%');
                            root.style.setProperty('--ladeleistung_percent_round', percent + '%');
                        }
                        break;
                    case 'verbrauchgesamt':
                        var element = document.getElementById(parameter);
                        if (decodedData[parameter]) {
                            document.getElementById("verbrauchgesamt").classList.remove("hidden");
                            document.getElementById("verbrauchgesamthead").classList.remove("hidden");
                            document.getElementById("verbrauch").classList.remove("hidden");
                            if (element && parameter !== 'phasen' && parameter !== 'phasenvalue') element.textContent = decodedData[parameter];
                        }
                        break;
                    case 'verbrauchtag':
                        var element = document.getElementById(parameter);
                        if (decodedData[parameter]) {
                            document.getElementById("verbrauchtag").classList.remove("hidden");
                            document.getElementById("verbrauchtaghead").classList.remove("hidden");
                            document.getElementById("verbrauch").classList.remove("hidden");
                            if (element && parameter !== 'phasen' && parameter !== 'phasenvalue') element.textContent = decodedData[parameter];
                        }
                        break;
                    case 'kostentag':
                        var element = document.getElementById(parameter);
                        if (decodedData[parameter]) {
                            document.getElementById("trkosten").classList.remove("hidden");
                            document.getElementById("kostentag").classList.remove("hidden");
                            document.getElementById("kostentaghead").classList.remove("hidden");
                            if (element && parameter !== 'phasen' && parameter !== 'phasenvalue') element.textContent = decodedData[parameter];
                        }
                        break;
                    case 'kostengesamt':
                        var element = document.getElementById(parameter);
                        if (decodedData[parameter]) {
                            document.getElementById("trkosten").classList.remove("hidden");
                            document.getElementById("kostengesamt").classList.remove("hidden");
                            document.getElementById("kostengesamthead").classList.remove("hidden");
                            if (element && parameter !== 'phasen' && parameter !== 'phasenvalue') element.textContent = decodedData[parameter];
                        }
                        break;
                    case 'verriegelung':
                        var element = document.getElementById(parameter);
                        if (decodedData[parameter]) {
                            document.getElementById("trverriegelung").classList.remove("hidden");
                            if (element && parameter !== 'phasen' && parameter !== 'phasenvalue') element.textContent = decodedData[parameter];
                        }
                        break;
                    case 'reichweite':
                        var element = document.getElementById(parameter);
                        if (decodedData[parameter]) {
                            document.getElementById("trreichweite").classList.remove("hidden");
                            if (element && parameter !== 'phasen' && parameter !== 'phasenvalue') element.textContent = decodedData[parameter];
                        }
                        break;
                    case 'kabel':
                        var element = document.getElementById(parameter);
                        if (decodedData[parameter]) {
                            document.getElementById("trkabel").classList.remove("hidden");
                            if (element && parameter !== 'phasen' && parameter !== 'phasenvalue') element.textContent = decodedData[parameter];
                        }
                        break;
                    case 'zugangskontrolle':
                        var element = document.getElementById(parameter);
                        if (decodedData[parameter]) {
                            document.getElementById("trzugang").classList.remove("hidden");
                            if (element && parameter !== 'phasen' && parameter !== 'phasenvalue') element.textContent = decodedData[parameter];
                            element.textContent = decodedData[parameter];
                        }
                        break;
                    case 'fehler':
                        updateFehlerDisplay(value, decodedData['fehlervalue']);
                        break;
                    case 'fehlervalue':
                        updateFehlerDisplay(decodedData['fehler'], value);
                        break;
                    case 'phasenvalue':
                    case 'phasen':
                        trphasen.classList.remove("hidden");
                        // Phasen-Icons aktualisieren (nutzt updatePhaseIcons, falls vorhanden)
                        if (typeof updatePhaseIcons === 'function') {
                            updatePhaseIcons(decodedData[parameter]);
                        } else {
                            // Fallback: direkte DOM-Manipulation für Phasen-Icons (Legacy)
                            if (decodedData[parameter] === 1) {
                                phase1.classList.remove('fa-circle');
                                phase1.classList.add('fa-circle-bolt', 'fa-light');
                                phase2.classList.remove('fa-circle-bolt');
                                phase2.classList.add('fa-circle', 'fa-light');
                                phase3.classList.remove('fa-circle-bolt');
                                phase3.classList.add('fa-circle', 'fa-light');
                            } else if (decodedData[parameter] === 2) {
                                phase1.classList.remove('fa-circle');
                                phase1.classList.add('fa-circle-bolt', 'fa-light');
                                phase2.classList.remove('fa-circle');
                                phase2.classList.add('fa-circle-bolt', 'fa-light');
                                phase3.classList.remove('fa-circle-bolt');
                                phase3.classList.add('fa-circle', 'fa-light');
                            } else if (decodedData[parameter] === 3) {
                                phase1.classList.remove('fa-circle');
                                phase1.classList.add('fa-circle-bolt', 'fa-light');
                                phase2.classList.remove('fa-circle');
                                phase2.classList.add('fa-circle-bolt', 'fa-light');
                                phase3.classList.remove('fa-circle');
                                phase3.classList.add('fa-circle-bolt', 'fa-light');
                            } else {
                                phase1.classList.remove('fa-circle-bolt');
                                phase1.classList.add('fa-circle', 'fa-light');
                                phase2.classList.remove('fa-circle-bolt');
                                phase2.classList.add('fa-circle', 'fa-light');
                                phase3.classList.remove('fa-circle-bolt');
                                phase3.classList.add('fa-circle', 'fa-light');
                            }
                        }
                        window.phasecount = decodedData[parameter];
                        if (DEBUG) console.log('Calling updateLedAnimation() after phasecount update');
                        updateLedAnimation();
                        break;
                    case 'socschaltervalue':
                        if (decodedData[parameter] === true) {
                            socdiv.className = 'balkendiagramm_soc';
                        }
                        else {
                            socdiv.className = 'hidden';
                        }
                        break;
                    case 'zielsocschaltervalue':
                        const zielsocContainer = document.getElementById('zielsoc_container');
                        if (zielsocContainer) {
                            if (decodedData[parameter] === true) {
                                zielsocContainer.classList.remove('hidden');
                                updateZielSOCTextPosition();
                                setTimeout(updateZielSOCTextPosition, 50); // z.B. 50ms später nochmal
                                console.log('[DEBUG] zielsocschaltervalue:', decodedData[parameter], '| zielsoc_container sichtbar:', !zielsocContainer.classList.contains('hidden'));
                            } else {
                                zielsocContainer.classList.add('hidden');
                                console.log('[DEBUG] zielsocschaltervalue:', decodedData[parameter], '| zielsoc_container sichtbar:', !zielsocContainer.classList.contains('hidden'));
                            }
                        }
                        break;
                    case 'balkenverlaufsocfarbe1':
                        root.style.setProperty('--balkenverlaufsocfarbe1', decodedData[parameter]);
                        break;
                    case 'balkenverlaufsocfarbe2':
                        root.style.setProperty('--balkenverlaufsocfarbe2', decodedData[parameter]);
                        break;
                    case 'balkenverlauffarbe1':
                        root.style.setProperty('--balkenverlauffarbe1', decodedData[parameter]);
                        break;
                    case 'balkenverlauffarbe2':
                        root.style.setProperty('--balkenverlauffarbe2', decodedData[parameter]);
                        break;
                    case 'statusschriftgroesse':
                        root.style.setProperty('--statusschriftgroesse', decodedData[parameter] + 'px');
                        break;
                    case 'programmschriftgroesse':
                        root.style.setProperty('--programmschriftgroesse', decodedData[parameter] + 'px');
                        break;
                    case 'infoschriftgroesse':
                        root.style.setProperty('--infoschriftgroesse', decodedData[parameter] + 'px');
                        break;
                    case 'balkenschriftgroesse':
                        root.style.setProperty('--balkenschriftgroesse', decodedData[parameter] + 'px');
                        break;
                    case 'bildbreite':
                        root.style.setProperty('--bildbreite', decodedData[parameter] + '%');
                        if (decodedData[parameter] !== 0) {
                            div1.className = 'div1';
                        }
                        else {
                            div1.className = 'hidden';
                            div2.style.padding = '0px 5px 5px 0px';
                            div2.style.margin = '0px 0px 0px 0px';
                        }
                        break;
                    case 'image1':
                        mainDiv = document.querySelector('body');
                        mainDiv.style.setProperty('--background-image', 'url(' + decodedData[parameter] + ')');
                        break;
                    case 'bildtransparenz':
                        root.style.setProperty('--bildtransparenz', decodedData[parameter]);
                        break;
                    case 'kachelhintergrundfarbe':

                        if (decodedData[parameter] === '#FFFFFFFFFFFFFFFF') {
                            root.style.setProperty('--hintergrundfarbe', 'rgba(0, 0, 0, 0)');
                        }
                        else {
                            root.style.setProperty('--hintergrundfarbe', decodedData[parameter]);
                        }
                        break;

                    default:
                        // Debug: Ausgabe, welches Element gesetzt wird (auskommentiert)
                        // Setze innerHTML nur, wenn das Ziel-Element existiert
                        // (Optional) innerHTML setzen, Beispiel für Icon (auskommentiert)
                        break;
                }

            }
        }


        // Globale Hilfsfunktion für Ziel-SOC-Text-Update
        function updateZielSOCTextPosition() {
            const zielsocContainer = document.getElementById('zielsoc_container');
            //if (!zielsocContainer || zielsocContainer.classList.contains('hidden')) return;

            const root = document.documentElement;
            const zielsocTextElement = document.getElementById('zielsoc_text_element');
            const socElement = document.getElementById('soc');
            const zielsocValueString = getComputedStyle(root).getPropertyValue('--zielsocvalue').trim();
            if (zielsocTextElement && socElement && zielsocValueString) {
                // Wert setzen
                const zielsocValueNum = parseFloat(zielsocValueString);
                const zielsocValueDisplay = document.getElementById('zielsoc_value');
                if (zielsocValueDisplay) {
                    zielsocValueDisplay.textContent = zielsocValueNum.toLocaleString('de-DE', {maximumFractionDigits: 1}) + ' %';
                }
                // Positionierung
                if (zielsocValueNum > 50) {
                    zielsocTextElement.classList.remove('position-before-bar');
                } else {
                    zielsocTextElement.classList.add('position-before-bar');
                }
                // Überlappungserkennung
                const zielsocRect = zielsocTextElement.getBoundingClientRect();
                const socRect = socElement.getBoundingClientRect();
                const overlap = !(
                    zielsocRect.right < socRect.left ||
                    zielsocRect.left > socRect.right ||
                    zielsocRect.bottom < socRect.top ||
                    zielsocRect.top > socRect.bottom
                );
                if (overlap) {
                    zielsocTextElement.style.visibility = 'hidden';
                    console.log('[DEBUG] Ziel-SOC-Text overlap:', overlap, '| Sichtbarkeit: hidden');
                } else {
                    zielsocTextElement.style.visibility = 'visible';
                    console.log('[DEBUG] Ziel-SOC-Text overlap:', overlap, '| Sichtbarkeit: visible');
                }
            }
        }
</script>
